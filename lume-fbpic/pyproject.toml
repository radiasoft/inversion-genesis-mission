[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lume_fbpic"
version = "0.1.0"
description = "LUMEModel implementation wrapping inversion_fbpic for virtual accelerators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lume-base",
    "inversion_fbpic",
    "attrs>=23.2",
    "numpy",
    "scipy",
    "h5py",
    "openpmd-viewer",
    "openpmd-beamphysics>=0.16",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["lume_fbpic"]
namespaces = false
