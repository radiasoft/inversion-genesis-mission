[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inversion_common"
version = "0.1.0"
description = "Shared utilities for Inversion Lab monorepo"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
]

[tool.setuptools]
packages = ["common"]

[tool.jupytext]
formats = "ipynb,py:light"
notebook_metadata_filter = "jupytext,-all"
cell_metadata_filter = "-all"

[tool.ruff]
# Exclude patterns for ruff linting and formatting
exclude = [
    "*.ipynb",                  # Jupyter notebooks
    "**/notebooks/**/*.py",     # Jupytext paired .py files
]
target-version = "py311"

[tool.black]
# Black uses a single regular expression string
# Matches any .ipynb file OR any .py file inside a 'notebooks' directory
force-exclude = '\.ipynb$|notebooks/.*\.py$'
