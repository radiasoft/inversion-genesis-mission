[pytest]
# Collect tests from every package in the repo, so new packages are picked up
# without touching CI. Each package's dependencies must be installed in the
# environment that runs this (see .github/workflows/pytest.yml).
testpaths = .

# geecs-lume-twin is deliberately NOT collected here. It requires Python >=3.11
# plus torch and lume-pva/lume-cheetah installed from pinned GitHub SHAs (not on
# PyPI), which would make the shared CI environment heavy and fragile for every
# other package. Run its tests from its own environment:
#   cd geecs-lume-twin && pytest
norecursedirs =
    geecs-lume-twin
    runs
    # pytest's defaults, restated because setting norecursedirs replaces them
    .* _darcs build CVS dist node_modules venv {arch} *.egg
    *.egg-info __pycache__

markers =
    integration: tests that call FBPIC setup/step (short runs only)
