name: Validate branch name
on:
  create:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    if: github.event_name != 'create' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }} # one source of truth
    steps:
      # 0  Fetch the repo – this creates the “origin” remote
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need refs/heads for ls-remote

      # 1  Pattern check
      - name: Ensure branch follows IG-###-short-description pattern
        run: |
          echo "Checking branch: $BRANCH"
          if [[ "$BRANCH" =~ ^IG-[0-9]{3}-[A-Za-z0-9._-]+$ ]]; then
            exit 0
          else
            echo "::error::Branch must match IG-###-short-description"; exit 1
          fi

      # 2  Duplicate ticket-ID check
      - name: Duplicate ticket ID check
        run: |
          # Extract ticket prefix: IG-123
          id=$(echo "$BRANCH" | sed -E 's/^(IG-[0-9]{3}).*$/\1/')

          # List remote branches that share the same ticket ID
          duplicates=$(git ls-remote --heads origin \
                        | awk '{print $2}' \
                        | cut -d/ -f3- \
                        | grep "^${id}-" \
                        | grep -vFx -- "$BRANCH" || true)

          # Fail if any duplicate exists
          if [ -n "$duplicates" ]; then
            echo "::error::Ticket $id already has branch(es):"
            echo "$duplicates" | sed 's/^/  • /'
            exit 1
          fi
